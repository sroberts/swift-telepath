name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Conformance is pinned to one Synapse release. Bump here, in Package.swift's
  # SYNAPSE_PINNED_VERSION comment, in README.md, and regenerate vectors together.
  SYNAPSE_VERSION: "2.249.0"
  # Turns "scheduling on an event loop that has already shut down" from a line of
  # stderr nobody reads into a crash. That ordering bug is invisible otherwise —
  # the tests still pass — and SwiftNIO has said it will become a crash anyway.
  SWIFTNIO_STRICT: "1"
  # Every Linux job now runs in this image and shares one cache entry. The tag is
  # part of the key so a toolchain bump cannot restore objects built by the old
  # compiler, which SwiftPM would then have to discard anyway.
  SWIFT_CACHE_TAG: swift-6.2-noble

jobs:
  unit:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Linux runs in the same image as every other Linux job. It used to install a
    # toolchain with swift-actions/setup-swift, and that toolchain is not
    # byte-identical run to run: the dependency cache restored (258 MB of it) and
    # SwiftPM recompiled the whole graph anyway, because a changed compiler
    # invalidates every module. Pinning the image took the job from 449s to a
    # cache hit that is actually usable, and lets it share one cache entry with
    # the integration jobs instead of keeping a second copy.
    #
    # An unset matrix.container evaluates to empty, which runs directly on the
    # runner -- that is how macOS opts out.
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
          - os: ubuntu-latest
            container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4

      # The macOS image default Xcode is not a pin: GitHub can roll it back,
      # which would resurrect the resolution failure that dependency tools
      # versions 6.1/6.2 cause on an older toolchain, on this half of the matrix
      # while Linux stayed green.
      - name: Pin the macOS toolchain
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Record the toolchain in the log
        run: swift --version

      # SwiftPM compiles every dependency from source, which is the bulk of each
      # Linux job. The key deliberately covers only Package.resolved and the
      # toolchain, never our own sources: dependencies stay compiled across
      # commits while anything in Sources/ or Tests/ is always rebuilt. The
      # Documentation job is left uncached on purpose -- it is the warning gate,
      # and an incremental build does not re-emit warnings for files it did not
      # recompile.
      - name: Cache compiled dependencies
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: .build
          key: swiftpm-${{ env.SWIFT_CACHE_TAG }}-${{ hashFiles('Package.resolved') }}
          restore-keys: swiftpm-${{ env.SWIFT_CACHE_TAG }}-

      - name: Build
        run: swift build --build-tests

      - name: Unit tests
        run: swift test

      # The integration suites skip themselves without a server. That default is
      # convenient locally and dangerous in CI, so prove the skip is deliberate
      # here and require them in the integration job below.
      - name: Confirm integration suites skipped deliberately
        run: |
          # POSIX sh only on the Linux half, which now runs in a container under
          # `sh -e {0}` rather than bash. Keep bashisms out; `set -o pipefail` has
          # already aborted a container step here once, before a test could run.
          #
          # Capture the status rather than piping to tee, which would report tee's
          # exit code and hide a failing test run.
          rc=0
          swift test > test-output.txt 2>&1 || rc=$?
          cat test-output.txt
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          if ! grep -q "Suite IntegrationTests skipped" test-output.txt; then
            echo "::error::IntegrationTests neither ran nor skipped as expected"
            exit 1
          fi

  integration:
    name: Integration (tcp + cell)
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    # One job rather than a transport matrix. Both transports talk to the same
    # Cortex and run the same suite, so a matrix bought nothing but a second
    # container to provision and a second full build of the package. Both still
    # run unconditionally, and both still report -- see the loop below.
    #
    # ssl:// lives in the integration-tls job, which needs a certificate
    # authority and two listeners to cover pinning and client certificates.
    steps:
      - uses: actions/checkout@v4

      # SwiftPM compiles every dependency from source, which is the bulk of each
      # Linux job. The key deliberately covers only Package.resolved and the
      # toolchain, never our own sources: dependencies stay compiled across
      # commits while anything in Sources/ or Tests/ is always rebuilt. The
      # Documentation job is left uncached on purpose -- it is the warning gate,
      # and an incremental build does not re-emit warnings for files it did not
      # recompile.
      - name: Cache compiled dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: swiftpm-${{ env.SWIFT_CACHE_TAG }}-${{ hashFiles('Package.resolved') }}
          restore-keys: swiftpm-${{ env.SWIFT_CACHE_TAG }}-

      # Synapse requires Python >= 3.11, so this image must be noble (3.12), not
      # jammy (3.10).
      - name: Install Synapse ${{ env.SYNAPSE_VERSION }}
        run: |
          apt-get update && apt-get install -y --no-install-recommends python3-venv
          python3 --version
          python3 -m venv /opt/synvenv
          /opt/synvenv/bin/pip install --quiet "synapse==${SYNAPSE_VERSION}"

      - name: Start Cortex
        run: |
          # Redirect to a file and detach: leaving stdout on the step's pipe means
          # the pipe closes when the step ends, and the server then dies of
          # BrokenPipeError on its next log write while tests are still running.
          PYTHON=/opt/synvenv/bin/python nohup ./scripts/run-test-cortex.sh \
            > cortex.log 2>&1 &
          for i in $(seq 1 120); do
            if [ -S .testcortex/cortex00/sock ]; then echo "cortex ready"; break; fi
            sleep 2
          done
          test -S .testcortex/cortex00/sock || {
            echo "::error::Cortex failed to start"; tail -40 cortex.log; exit 1; }
          /opt/synvenv/bin/python -m synapse.tools.service.moduser \
            --svcurl "cell://$PWD/.testcortex/cortex00" --passwd s3cret root

      - name: Integration tests over every transport
        # Missing server becomes a failure rather than a silent skip.
        env:
          TELEPATH_REQUIRE_INTEGRATION: "1"
        # POSIX sh only -- this container job runs under `sh -e {0}`.
        #
        # A failing transport must not stop the other from running, or a tcp
        # regression would hide whatever cell was about to report. Both run, both
        # are reported, and the step fails if either did.
        run: |
          # The Cortex embeds an Axon, whose upload() returns a dynamic share.
          # That is the only live source of a t2:share, so point the share test
          # at it.
          TELEPATH_AXON_URL="cell://$PWD/.testcortex/cortex00/axon"
          export TELEPATH_AXON_URL

          overall=0
          for transport in tcp cell; do
            case "$transport" in
              tcp)  TELEPATH_TEST_URL="tcp://root:s3cret@127.0.0.1:27492/" ;;
              cell) TELEPATH_TEST_URL="cell://$PWD/.testcortex/cortex00" ;;
            esac
            export TELEPATH_TEST_URL

            echo "::group::$transport"
            rc=0
            swift test || rc=$?
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              echo "::error::integration tests failed over $transport"
              overall=1
            fi
          done
          exit "$overall"

      - name: Cortex log
        if: failure()
        run: tail -100 cortex.log

  integration-tls:
    name: Integration (TLS)
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4

      # SwiftPM compiles every dependency from source, which is the bulk of each
      # Linux job. The key deliberately covers only Package.resolved and the
      # toolchain, never our own sources: dependencies stay compiled across
      # commits while anything in Sources/ or Tests/ is always rebuilt. The
      # Documentation job is left uncached on purpose -- it is the warning gate,
      # and an incremental build does not re-emit warnings for files it did not
      # recompile.
      - name: Cache compiled dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: swiftpm-${{ env.SWIFT_CACHE_TAG }}-${{ hashFiles('Package.resolved') }}
          restore-keys: swiftpm-${{ env.SWIFT_CACHE_TAG }}-

      - name: Install Synapse ${{ env.SYNAPSE_VERSION }}
        run: |
          apt-get update && apt-get install -y --no-install-recommends python3-venv
          python3 -m venv /opt/synvenv
          /opt/synvenv/bin/pip install --quiet "synapse==${SYNAPSE_VERSION}"

      # Generates a CA, a server certificate and a client certificate, then starts
      # two listeners: Synapse sets CERT_REQUIRED on any listener carrying ?ca=, so
      # one cannot serve both password and certificate authentication.
      - name: Start TLS listeners
        run: PYTHON=/opt/synvenv/bin/python ./scripts/run-tls-test-cortex.sh

      - name: TLS integration tests
        env:
          TELEPATH_TLS_HOST: localhost
          TELEPATH_TLS_PORT: "27500"
          TELEPATH_TLS_CLIENTCERT_PORT: "27501"
        # POSIX sh only. Every step of this container job runs under
        # `shell: sh -e {0}` (the non-container jobs get `/usr/bin/bash -e {0}`),
        # and dash rejects `set -o pipefail` outright with "Illegal option", which
        # aborted this step before a single test ran. Keep bashisms out of the
        # container jobs.
        run: |
          export TELEPATH_CERT_DIR="$PWD/.testcerts"

          # Assigned then exported separately: `export VAR="$(cmd)"` returns
          # export's status, so a failing command substitution would slip past
          # `set -e` and the pinning test would fail on an empty hash instead.
          TELEPATH_CERT_HASH="$(cat .testcerts/certhash)"
          export TELEPATH_CERT_HASH
          if [ -z "$TELEPATH_CERT_HASH" ]; then
            echo "::error::.testcerts/certhash is empty; the TLS environment did not build"
            exit 1
          fi

          rc=0
          swift test --filter TLSIntegrationTests > tls-output.txt 2>&1 || rc=$?
          cat tls-output.txt
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi

          # A filter that matches nothing exits 0, and the suite skips itself when
          # TELEPATH_CERT_DIR is unset, so assert the tests actually ran rather
          # than trusting a green exit. The skip check comes first: a skipped suite
          # emits no "passed" line, so testing for that first would report the
          # vaguer "did not run" for what is really a gating problem.
          if grep -q "Suite TLSIntegrationTests skipped" tls-output.txt; then
            echo "::error::TLSIntegrationTests skipped; check TELEPATH_CERT_DIR"
            exit 1
          fi
          if ! grep -q "Suite TLSIntegrationTests passed" tls-output.txt; then
            echo "::error::TLSIntegrationTests did not run"
            exit 1
          fi

      - name: Server logs
        if: failure()
        run: |
          tail -60 .testcortex/cortex-tls/server.log || true
          tail -60 .testcortex/cell-clientcert/server.log || true

  integration-docker:
    name: Integration (official image)
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    services:
      cortex:
        image: vertexproject/synapse-cortex:v2.249.0
        env:
          SYN_CORTEX_AUTH_PASSWD: s3cret
          SYN_CORTEX_LIMIT_DISK_FREE: "0"
          SYN_AXON_LIMIT_DISK_FREE: "0"
          SYN_JSONSTOR_LIMIT_DISK_FREE: "0"
        # A Cortex takes roughly a minute to open its telepath port, and the image
        # ships its own HEALTHCHECK. Without a start period the runner declares it
        # unhealthy while it is still starting normally.
        options: >-
          --health-interval 10s
          --health-timeout 10s
          --health-retries 30
          --health-start-period 90s
    steps:
      - uses: actions/checkout@v4

      # SwiftPM compiles every dependency from source, which is the bulk of each
      # Linux job. The key deliberately covers only Package.resolved and the
      # toolchain, never our own sources: dependencies stay compiled across
      # commits while anything in Sources/ or Tests/ is always rebuilt. The
      # Documentation job is left uncached on purpose -- it is the warning gate,
      # and an incremental build does not re-emit warnings for files it did not
      # recompile.
      - name: Cache compiled dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: swiftpm-${{ env.SWIFT_CACHE_TAG }}-${{ hashFiles('Package.resolved') }}
          restore-keys: swiftpm-${{ env.SWIFT_CACHE_TAG }}-

      - name: Wait for the Cortex to accept connections
        run: |
          apt-get update && apt-get install -y --no-install-recommends netcat-openbsd
          for i in $(seq 1 120); do
            if nc -z cortex 27492; then echo "cortex ready"; exit 0; fi
            sleep 2
          done
          echo "::error::Cortex service never opened port 27492"; exit 1

      - name: Integration tests against the published image
        env:
          TELEPATH_TEST_URL: tcp://root:s3cret@cortex:27492/
          TELEPATH_REQUIRE_INTEGRATION: "1"
        run: swift test

  docs:
    name: Documentation
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Dependencies declare tools versions 6.1 and 6.2, and this package now
      # declares 6.2, so an older toolchain cannot resolve it. The macOS image
      # default Xcode is not a pin: GitHub can roll it back, which would
      # resurrect exactly the resolution failure this pin exists to prevent.
      - name: Pin the macOS toolchain
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Record the toolchain in the log
        run: swift --version

      # spec.md M5 asks for published DocC. This catches both DocC warnings —
      # broken symbol links and undocumented parameters, which read as
      # "documented" until someone follows them — and compiler warnings, since
      # generating documentation compiles the target. Incremental builds do not
      # re-emit warnings, so a local check can miss what this run catches.
      - name: Build DocC for every public target
        run: |
          set -euo pipefail
          failed=0
          for target in Msgpack Telepath Synapse TelepathTLS; do
            echo "::group::$target"
            swift package generate-documentation --target "$target" 2>&1 | tee "docc-$target.log"
            if grep -q "warning:" "docc-$target.log"; then
              echo "::error::warnings while documenting $target"
              grep "warning:" "docc-$target.log"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"

  fuzz:
    name: Fuzz (short)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Dependencies declare tools versions 6.1 and 6.2, and this package now
      # declares 6.2, so an older toolchain cannot resolve it. The macOS image
      # default Xcode is not a pin: GitHub can roll it back, which would
      # resurrect exactly the resolution failure this pin exists to prevent.
      - name: Pin the macOS toolchain
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Record the toolchain in the log
        run: swift --version

      # The long run lives in nightly.yml; this catches regressions per pull request.
      - name: Fuzz the codec for two minutes
        run: swift run -c release msgpack-fuzz --seconds 120
