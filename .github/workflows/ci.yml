name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Conformance is pinned to one Synapse release. Bump here, in Package.swift's
  # SYNAPSE_PINNED_VERSION comment, in README.md, and regenerate vectors together.
  SYNAPSE_VERSION: "2.249.0"

jobs:
  unit:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Swift (Linux)
        if: runner.os == 'Linux'
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"

      - name: Build
        run: swift build --build-tests

      - name: Unit tests
        run: swift test

      # The integration suites skip themselves without a server. That default is
      # convenient locally and dangerous in CI, so prove the skip is deliberate
      # here and require them in the integration job below.
      - name: Confirm integration suites skipped deliberately
        run: |
          swift test 2>&1 | tee test-output.txt
          grep -q "Suite IntegrationTests skipped" test-output.txt \
            || { echo "::error::IntegrationTests neither ran nor skipped as expected"; exit 1; }

  integration:
    name: Integration (${{ matrix.transport }})
    runs-on: ubuntu-latest
    container: swift:6.0-noble
    strategy:
      fail-fast: false
      matrix:
        # ssl:// lives in the integration-tls job, which needs a certificate
        # authority and two listeners to cover pinning and client certificates.
        transport: [tcp, cell]
    steps:
      - uses: actions/checkout@v4

      # Synapse requires Python >= 3.11, so this image must be noble (3.12), not
      # jammy (3.10).
      - name: Install Synapse ${{ env.SYNAPSE_VERSION }}
        run: |
          apt-get update && apt-get install -y --no-install-recommends python3-venv
          python3 --version
          python3 -m venv /opt/synvenv
          /opt/synvenv/bin/pip install --quiet "synapse==${SYNAPSE_VERSION}"

      - name: Start Cortex
        run: |
          # Redirect to a file and detach: leaving stdout on the step's pipe means
          # the pipe closes when the step ends, and the server then dies of
          # BrokenPipeError on its next log write while tests are still running.
          PYTHON=/opt/synvenv/bin/python nohup ./scripts/run-test-cortex.sh \
            > cortex.log 2>&1 &
          for i in $(seq 1 120); do
            if [ -S .testcortex/cortex00/sock ]; then echo "cortex ready"; break; fi
            sleep 2
          done
          test -S .testcortex/cortex00/sock || {
            echo "::error::Cortex failed to start"; tail -40 cortex.log; exit 1; }
          /opt/synvenv/bin/python -m synapse.tools.service.moduser \
            --svcurl "cell://$PWD/.testcortex/cortex00" --passwd s3cret root

      - name: Select transport URL
        run: |
          case "${{ matrix.transport }}" in
            tcp)  echo "TELEPATH_TEST_URL=tcp://root:s3cret@127.0.0.1:27492/" >> $GITHUB_ENV ;;
            cell) echo "TELEPATH_TEST_URL=cell://$PWD/.testcortex/cortex00" >> $GITHUB_ENV ;;
          esac
          # The Cortex embeds an Axon, whose upload() returns a dynamic share. That
          # is the only live source of a t2:share, so point the share test at it.
          echo "TELEPATH_AXON_URL=cell://$PWD/.testcortex/cortex00/axon" >> $GITHUB_ENV

      - name: Integration tests
        # Missing server becomes a failure rather than a silent skip.
        env:
          TELEPATH_REQUIRE_INTEGRATION: "1"
        run: swift test

      - name: Cortex log
        if: failure()
        run: tail -100 cortex.log

  integration-tls:
    name: Integration (TLS)
    runs-on: ubuntu-latest
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v4

      - name: Install Synapse ${{ env.SYNAPSE_VERSION }}
        run: |
          apt-get update && apt-get install -y --no-install-recommends python3-venv
          python3 -m venv /opt/synvenv
          /opt/synvenv/bin/pip install --quiet "synapse==${SYNAPSE_VERSION}"

      # Generates a CA, a server certificate and a client certificate, then starts
      # two listeners: Synapse sets CERT_REQUIRED on any listener carrying ?ca=, so
      # one cannot serve both password and certificate authentication.
      - name: Start TLS listeners
        run: PYTHON=/opt/synvenv/bin/python ./scripts/run-tls-test-cortex.sh

      - name: TLS integration tests
        env:
          TELEPATH_TLS_HOST: localhost
          TELEPATH_TLS_PORT: "27500"
          TELEPATH_TLS_CLIENTCERT_PORT: "27501"
        run: |
          set -o pipefail
          export TELEPATH_CERT_DIR="$PWD/.testcerts"
          export TELEPATH_CERT_HASH="$(cat .testcerts/certhash)"
          swift test --filter TLSIntegrationTests 2>&1 | tee tls-output.txt
          # A filter that matches nothing exits 0, and the suite skips itself when
          # TELEPATH_CERT_DIR is unset, so assert the tests actually ran rather
          # than trusting a green exit.
          grep -q "Suite TLSIntegrationTests passed" tls-output.txt || {
            echo "::error::TLSIntegrationTests did not run"; exit 1; }
          grep -q "Suite TLSIntegrationTests skipped" tls-output.txt && {
            echo "::error::TLSIntegrationTests skipped"; exit 1; }
          exit 0

      - name: Server logs
        if: failure()
        run: |
          tail -60 .testcortex/cortex-tls/server.log || true
          tail -60 .testcortex/cell-clientcert/server.log || true

  integration-docker:
    name: Integration (official image)
    runs-on: ubuntu-latest
    container: swift:6.0-noble
    services:
      cortex:
        image: vertexproject/synapse-cortex:v2.249.0
        env:
          SYN_CORTEX_AUTH_PASSWD: s3cret
          SYN_CORTEX_LIMIT_DISK_FREE: "0"
          SYN_AXON_LIMIT_DISK_FREE: "0"
          SYN_JSONSTOR_LIMIT_DISK_FREE: "0"
        # A Cortex takes roughly a minute to open its telepath port, and the image
        # ships its own HEALTHCHECK. Without a start period the runner declares it
        # unhealthy while it is still starting normally.
        options: >-
          --health-interval 10s
          --health-timeout 10s
          --health-retries 30
          --health-start-period 90s
    steps:
      - uses: actions/checkout@v4

      - name: Wait for the Cortex to accept connections
        run: |
          apt-get update && apt-get install -y --no-install-recommends netcat-openbsd
          for i in $(seq 1 120); do
            if nc -z cortex 27492; then echo "cortex ready"; exit 0; fi
            sleep 2
          done
          echo "::error::Cortex service never opened port 27492"; exit 1

      - name: Integration tests against the published image
        env:
          TELEPATH_TEST_URL: tcp://root:s3cret@cortex:27492/
          TELEPATH_REQUIRE_INTEGRATION: "1"
        run: swift test

  fuzz:
    name: Fuzz (short)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # The long run lives in nightly.yml; this catches regressions per pull request.
      - name: Fuzz the codec for two minutes
        run: swift run -c release msgpack-fuzz --seconds 120
