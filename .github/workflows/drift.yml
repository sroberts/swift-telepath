name: Synapse drift

# Telepath is defined by its implementation and carries no stability guarantee.
# Vertex can change it in any minor release, so the mitigation is to check every
# week rather than to assume nothing moved.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    name: Compare against the latest Synapse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Newer Synapse releases raise their Python floor (3.0.0 requires 3.14),
          # so track the latest interpreter rather than a pinned one.
          python-version: "3.x"

      # Ask PyPI directly first. A release whose Python requirement this runner
      # cannot satisfy is still drift worth reporting — and pip would otherwise
      # quietly resolve to an older version and report no change at all.
      - name: Query the newest published release
        id: query
        run: |
          python - <<'PYEOF' >> $GITHUB_OUTPUT
          import json, urllib.request
          with urllib.request.urlopen("https://pypi.org/pypi/synapse/json") as response:
              info = json.load(response)["info"]
          print(f"latest={info['version']}")
          print(f"requires_python={info.get('requires_python') or 'unspecified'}")
          PYEOF
          PINNED=$(grep -oE 'SYNAPSE_PINNED_VERSION = [0-9.]+' Package.swift | awk '{print $3}')
          echo "pinned=$PINNED" >> $GITHUB_OUTPUT

      - name: Install the latest Synapse
        id: install
        continue-on-error: true
        run: |
          python -m venv .venv-drift
          .venv-drift/bin/pip install --quiet "synapse==${{ steps.query.outputs.latest }}"
          INSTALLED=$(.venv-drift/bin/python -c "import synapse; print('.'.join(str(p) for p in synapse.version))")
          echo "installed=$INSTALLED" >> $GITHUB_OUTPUT

      - name: Regenerate codec vectors against the latest release
        id: vectors
        if: steps.install.outcome == 'success'
        run: |
          .venv-drift/bin/python tools/genvectors.py > /tmp/vectors-latest.json
          if diff -q Tests/MsgpackTests/vectors.json /tmp/vectors-latest.json > /dev/null; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            diff -u Tests/MsgpackTests/vectors.json /tmp/vectors-latest.json > /tmp/vectors.diff || true
            head -c 8000 /tmp/vectors.diff > /tmp/vectors-excerpt.diff
          fi

      # A version bump alone is worth knowing about; a vector change means the wire
      # format moved and the codec may no longer be correct.
      - name: Open an issue when the wire format or version moved
        if: steps.vectors.outputs.changed == 'true' || steps.query.outputs.latest != steps.query.outputs.pinned
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST: ${{ steps.query.outputs.latest }}
          PINNED: ${{ steps.query.outputs.pinned }}
          REQUIRES_PYTHON: ${{ steps.query.outputs.requires_python }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          VECTORS_CHANGED: ${{ steps.vectors.outputs.changed }}
        run: |
          TITLE="Synapse drift: pinned $PINNED, latest $LATEST"

          # Avoid filing the same issue every week.
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            echo "Issue #$EXISTING already open; nothing to file."
            exit 0
          fi

          BODY="Weekly drift check against the latest Synapse release.

          | | |
          |---|---|
          | Pinned | \`$PINNED\` |
          | Latest | \`$LATEST\` |
          | Requires Python | \`$REQUIRES_PYTHON\` |
          | Install | \`$INSTALL_OUTCOME\` |
          | Codec vectors changed | \`$VECTORS_CHANGED\` |

          "
          if [ "$INSTALL_OUTCOME" != "success" ]; then
            BODY="$BODY**The latest release could not be installed on this runner**, most
          likely because it raised its Python floor to \`$REQUIRES_PYTHON\`. The codec was
          therefore not re-checked against it. A major version bump may change the
          protocol itself, not just the packed bytes — review before assuming the
          client still conforms.
          "
          elif [ "$VECTORS_CHANGED" = "true" ]; then
            BODY="$BODY**The packed bytes changed.** The codec may no longer match the
          wire format. Review the diff before bumping.

          \`\`\`diff
          $(cat /tmp/vectors-excerpt.diff)
          \`\`\`
          "
          else
            BODY="$BODY Codec vectors are unchanged, so the msgpack layer is unaffected.
          \`features\` entries and \`sharinfo\` contents still change between releases,
          so re-run the integration suite against \`$LATEST\` before bumping.
          "
          fi

          BODY="$BODY
          To bump: update \`SYNAPSE_PINNED_VERSION\` in Package.swift, the version in
          README.md and the CI workflows, then regenerate vectors with
          \`tools/genvectors.py\`."

          gh issue create --title "$TITLE" --body "$BODY" --label "synapse-drift" || \
            gh issue create --title "$TITLE" --body "$BODY"

      - name: Report
        run: |
          echo "Pinned:          ${{ steps.query.outputs.pinned }}"
          echo "Latest:          ${{ steps.query.outputs.latest }}"
          echo "Requires Python: ${{ steps.query.outputs.requires_python }}"
          echo "Install:         ${{ steps.install.outcome }}"
          echo "Vectors changed: ${{ steps.vectors.outputs.changed }}"
